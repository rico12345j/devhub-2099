<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 السجلات — Render Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ===== الشريط الجانبي ===== -->
<div class="sidebar">
    <div class="sidebar-header">
        <i class="fas fa-cloud"></i>
        <span>Render</span>
    </div>
    <div class="sidebar-menu">
        <a href="/dashboard" class="sidebar-item">
            <i class="fas fa-home"></i> لوحة التحكم
        </a>
        <a href="/services" class="sidebar-item">
            <i class="fas fa-server"></i> الخدمات
        </a>
        <a href="/deploy" class="sidebar-item">
            <i class="fas fa-rocket"></i> نشر
        </a>
        <a href="/settings" class="sidebar-item">
            <i class="fas fa-cog"></i> الإعدادات
        </a>
        <a href="#" class="sidebar-item" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </a>
    </div>
</div>

<!-- ===== المحتوى الرئيسي ===== -->
<div class="main-content">
    <div class="topbar">
        <h1>📋 سجلات الخدمة</h1>
        <div class="topbar-actions">
            <button class="btn btn-outline" onclick="refreshLogs()">
                <i class="fas fa-sync"></i> تحديث
            </button>
            <button class="btn btn-outline" onclick="downloadLogs()">
                <i class="fas fa-download"></i> تحميل
            </button>
            <button class="btn btn-danger" onclick="clearLogs()">
                <i class="fas fa-eraser"></i> مسح
            </button>
        </div>
    </div>

    <!-- ===== معلومات الخدمة ===== -->
    <div class="service-info-bar" id="serviceInfo">
        <span><strong>الخدمة:</strong> <span id="serviceName">-</span></span>
        <span><strong>الحالة:</strong> <span id="serviceStatus">-</span></span>
        <span><strong>عدد السجلات:</strong> <span id="logCount">0</span></span>
    </div>

    <!-- ===== فلترة السجلات ===== -->
    <div class="filter-bar">
        <input type="text" class="search-input" id="logSearch" placeholder="🔍 بحث في السجلات..." oninput="searchLogs(this.value)">
        <select class="filter-select" id="logLevel" onchange="filterLogs(this.value)">
            <option value="all">كل المستويات</option>
            <option value="INFO">معلومات</option>
            <option value="WARNING">تحذير</option>
            <option value="ERROR">خطأ</option>
            <option value="SUCCESS">نجاح</option>
        </select>
    </div>

    <!-- ===== عرض السجلات ===== -->
    <div class="logs-container" id="logsContainer">
        <div class="log-line">
            <span class="log-time">[00:00:00]</span>
            <span class="log-level info">ℹ️</span>
            <span class="log-message">جارٍ تحميل السجلات...</span>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script>
    const serviceId = window.location.pathname.split('/').pop();

    // ===== تحميل السجلات =====
    async function loadLogs() {
        try {
            const response = await fetch(`/api/logs/${serviceId}`);
            const data = await response.json();
            
            if (data.success) {
                document.getElementById('serviceName').textContent = data.service?.name || serviceId;
                document.getElementById('serviceStatus').textContent = data.service?.status || 'unknown';
                document.getElementById('logCount').textContent = data.logs.length;
                
                const container = document.getElementById('logsContainer');
                if (data.logs.length === 0 || data.logs[0] === 'لا توجد سجلات') {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>لا توجد سجلات</p>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = data.logs.map(log => {
                    const level = log.includes('✅') ? 'success' : 
                                 log.includes('⚠️') ? 'warning' : 
                                 log.includes('❌') ? 'error' : 'info';
                    const icon = level === 'success' ? '✅' :
                                level === 'warning' ? '⚠️' :
                                level === 'error' ? '❌' : 'ℹ️';
                    return `
                        <div class="log-line ${level}">
                            <span class="log-time">${log.substring(0, 20)}</span>
                            <span class="log-level">${icon}</span>
                            <span class="log-message">${log}</span>
                        </div>
                    `;
                }).join('');
                
                // تمرير إلى الأسفل
                container.scrollTop = container.scrollHeight;
            }
        } catch (error) {
            console.error('❌ فشل تحميل السجلات:', error);
        }
    }

    function refreshLogs() {
        loadLogs();
    }

    function downloadLogs() {
        window.location.href = `/api/logs/${serviceId}/download`;
    }

    async function clearLogs() {
        if (!confirm('🗑️ هل أنت متأكد من مسح جميع السجلات؟')) return;
        try {
            await fetch(`/api/logs/${serviceId}`, { method: 'DELETE' });
            loadLogs();
        } catch (error) {
            alert('❌ فشل مسح السجلات');
        }
    }

    function searchLogs(query) {
        // تنفيذ البحث
        const lines = document.querySelectorAll('.log-line');
        lines.forEach(line => {
            const text = line.textContent.toLowerCase();
            line.style.display = text.includes(query.toLowerCase()) ? '' : 'none';
        });
    }

    function filterLogs(level) {
        // تنفيذ التصفية
        const lines = document.querySelectorAll('.log-line');
        lines.forEach(line => {
            if (level === 'all') {
                line.style.display = '';
            } else {
                const hasLevel = line.classList.contains(level.toLowerCase());
                line.style.display = hasLevel ? '' : 'none';
            }
        });
    }

    loadLogs();
    setInterval(loadLogs, 15000);
</script>
</body>
</html>
