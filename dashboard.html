<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 لوحة التحكم — Render Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ===== الشريط الجانبي ===== -->
<div class="sidebar">
    <div class="sidebar-header">
        <i class="fas fa-cloud"></i>
        <span>Render</span>
    </div>
    <div class="sidebar-menu">
        <a href="/dashboard" class="sidebar-item active">
            <i class="fas fa-home"></i> لوحة التحكم
        </a>
        <a href="/services" class="sidebar-item">
            <i class="fas fa-server"></i> الخدمات
        </a>
        <a href="/deploy" class="sidebar-item">
            <i class="fas fa-rocket"></i> نشر
        </a>
        <a href="/settings" class="sidebar-item">
            <i class="fas fa-cog"></i> الإعدادات
        </a>
        <a href="#" class="sidebar-item" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </a>
    </div>
</div>

<!-- ===== المحتوى الرئيسي ===== -->
<div class="main-content">
    <div class="topbar">
        <h1>📊 لوحة التحكم</h1>
        <div class="topbar-actions">
            <button class="btn btn-primary" onclick="window.location.href='/deploy'">
                <i class="fas fa-plus"></i> نشر جديد
            </button>
            <button class="btn btn-outline" onclick="refreshDashboard()">
                <i class="fas fa-sync"></i> تحديث
            </button>
        </div>
    </div>

    <!-- ===== الإحصائيات ===== -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-server"></i></div>
            <div class="stat-info">
                <span class="stat-number" id="servicesCount">0</span>
                <span class="stat-label">الخدمات</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stat-info">
                <span class="stat-number" id="runningCount">0</span>
                <span class="stat-label">قيد التشغيل</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-database"></i></div>
            <div class="stat-info">
                <span class="stat-number" id="dbCount">0</span>
                <span class="stat-label">قواعد بيانات</span>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-clock"></i></div>
            <div class="stat-info">
                <span class="stat-number" id="uptime">00:00:00</span>
                <span class="stat-label">وقت التشغيل</span>
            </div>
        </div>
    </div>

    <!-- ===== الرسم البياني ===== -->
    <div class="section">
        <div class="section-header">
            <h2><i class="fas fa-chart-bar"></i> نشاط الخدمات</h2>
        </div>
        <div class="chart-container">
            <canvas id="activityChart" width="100%" height="200"></canvas>
        </div>
    </div>

    <!-- ===== الخدمات الأخيرة ===== -->
    <div class="section">
        <div class="section-header">
            <h2><i class="fas fa-history"></i> الخدمات الأخيرة</h2>
            <a href="/services" class="btn btn-outline">عرض الكل</a>
        </div>
        <div id="recentServices">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>لا توجد خدمات</p>
            </div>
        </div>
    </div>

    <!-- ===== النشاط الأخير ===== -->
    <div class="section">
        <div class="section-header">
            <h2><i class="fas fa-activity"></i> النشاط الأخير</h2>
        </div>
        <div id="recentActivity">
            <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <p>لا يوجد نشاط</p>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script>
    // ===== تحميل البيانات =====
    async function loadDashboard() {
        try {
            const res = await fetch('/api/services/');
            const data = await res.json();
            
            if (data.success) {
                const services = data.services;
                document.getElementById('servicesCount').textContent = services.length;
                document.getElementById('runningCount').textContent = 
                    services.filter(s => s.status === 'running').length;
                
                // عرض الخدمات الأخيرة
                const container = document.getElementById('recentServices');
                if (services.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>لا توجد خدمات</p>
                            <button class="btn btn-primary" onclick="window.location.href='/deploy'">
                                نشر خدمة جديدة
                            </button>
                        </div>
                    `;
                } else {
                    container.innerHTML = services.slice(0, 5).map(s => `
                        <div class="service-item">
                            <div class="service-info">
                                <span class="service-name">${s.name}</span>
                                <span class="service-status ${s.status}">${s.status}</span>
                                <span class="service-url">${s.url}</span>
                            </div>
                            <div class="service-actions">
                                <a href="/service/${s.id}" class="btn btn-outline">عرض</a>
                            </div>
                        </div>
                    `).join('');
                }
            }
        } catch (error) {
            console.error('❌ فشل تحميل البيانات:', error);
        }
    }

    function refreshDashboard() {
        loadDashboard();
        alert('🔄 تم تحديث لوحة التحكم');
    }

    // ===== رسم مخطط النشاط =====
    function drawChart() {
        const canvas = document.getElementById('activityChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;
        
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, width, height);
        
        const data = [30, 45, 60, 35, 70, 85, 55, 90, 75, 50];
        const barWidth = (width / data.length) - 10;
        const maxValue = Math.max(...data);
        
        data.forEach((value, index) => {
            const barHeight = (value / maxValue) * (height - 40);
            const x = index * (barWidth + 10) + 5;
            const y = height - barHeight - 20;
            
            const gradient = ctx.createLinearGradient(0, y, 0, height - 20);
            gradient.addColorStop(0, '#4a9eff');
            gradient.addColorStop(1, '#1a6fb5');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(x, y, barWidth, barHeight);
            
            ctx.fillStyle = '#8888aa';
            ctx.font = '10px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(value, x + barWidth/2, height - 5);
        });
    }

    loadDashboard();
    setInterval(loadDashboard, 10000);
    setTimeout(drawChart, 500);
</script>
</body>
</html>
