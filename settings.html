<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ الإعدادات — Render Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<!-- ===== الشريط الجانبي ===== -->
<div class="sidebar">
    <div class="sidebar-header">
        <i class="fas fa-cloud"></i>
        <span>Render</span>
    </div>
    <div class="sidebar-menu">
        <a href="/dashboard" class="sidebar-item">
            <i class="fas fa-home"></i> لوحة التحكم
        </a>
        <a href="/services" class="sidebar-item">
            <i class="fas fa-server"></i> الخدمات
        </a>
        <a href="/deploy" class="sidebar-item">
            <i class="fas fa-rocket"></i> نشر
        </a>
        <a href="/settings" class="sidebar-item active">
            <i class="fas fa-cog"></i> الإعدادات
        </a>
        <a href="#" class="sidebar-item" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </a>
    </div>
</div>

<!-- ===== المحتوى الرئيسي ===== -->
<div class="main-content">
    <div class="topbar">
        <h1>⚙️ الإعدادات</h1>
    </div>

    <!-- ===== الإعدادات ===== -->
    <div class="settings-container">
        <!-- الملف الشخصي -->
        <div class="settings-section">
            <h2><i class="fas fa-user"></i> الملف الشخصي</h2>
            <div class="settings-form">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="profileUsername" class="form-input" placeholder="اسم المستخدم">
                </div>
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="profileEmail" class="form-input" placeholder="البريد الإلكتروني">
                </div>
                <button class="btn btn-primary" onclick="saveProfile()">
                    <i class="fas fa-save"></i> حفظ الملف الشخصي
                </button>
            </div>
        </div>

        <!-- الأمان -->
        <div class="settings-section">
            <h2><i class="fas fa-lock"></i> الأمان</h2>
            <div class="settings-form">
                <div class="form-group">
                    <label>كلمة المرور الحالية</label>
                    <input type="password" id="oldPassword" class="form-input" placeholder="كلمة المرور الحالية">
                </div>
                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="كلمة المرور الجديدة">
                </div>
                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="تأكيد كلمة المرور">
                </div>
                <button class="btn btn-primary" onclick="changePassword()">
                    <i class="fas fa-key"></i> تغيير كلمة المرور
                </button>
            </div>
        </div>

        <!-- المظهر -->
        <div class="settings-section">
            <h2><i class="fas fa-palette"></i> المظهر</h2>
            <div class="settings-form">
                <div class="form-group">
                    <label>السمة</label>
                    <select id="themeSelect" class="form-select">
                        <option value="dark">داكن</option>
                        <option value="light">فاتح</option>
                        <option value="auto">تلقائي</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="saveTheme()">
                    <i class="fas fa-save"></i> حفظ السمة
                </button>
            </div>
        </div>

        <!-- الإشعارات -->
        <div class="settings-section">
            <h2><i class="fas fa-bell"></i> الإشعارات</h2>
            <div class="settings-form">
                <div class="toggle-group">
                    <label>
                        <input type="checkbox" id="notifEmail" checked>
                        الإشعارات عبر البريد الإلكتروني
                    </label>
                </div>
                <div class="toggle-group">
                    <label>
                        <input type="checkbox" id="notifPush" checked>
                        الإشعارات الفورية
                    </label>
                </div>
                <button class="btn btn-primary" onclick="saveNotifications()">
                    <i class="fas fa-save"></i> حفظ الإشعارات
                </button>
            </div>
        </div>

        <!-- النظام -->
        <div class="settings-section">
            <h2><i class="fas fa-info-circle"></i> معلومات النظام</h2>
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">الإصدار</span>
                    <span class="value">v1.0.0</span>
                </div>
                <div class="info-item">
                    <span class="label">عدد الخدمات</span>
                    <span class="value" id="sysServices">0</span>
                </div>
                <div class="info-item">
                    <span class="label">وقت التشغيل</span>
                    <span class="value" id="sysUptime">00:00:00</span>
                </div>
                <div class="info-item">
                    <span class="label">استخدام الذاكرة</span>
                    <span class="value" id="sysMemory">0%</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script>
    // ===== تحميل معلومات النظام =====
    async function loadSystemInfo() {
        try {
            const response = await fetch('/api/status');
            const data = await response.json();
            
            if (data.success) {
                const status = data.status;
                document.getElementById('sysServices').textContent = status.services || 0;
                document.getElementById('sysMemory').textContent = status.memory + '%';
                
                if (status.uptime) {
                    const seconds = Math.floor(status.uptime);
                    const hours = String(Math.floor(seconds / 3600)).padStart(2, '0');
                    const minutes = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
                    const secs = String(seconds % 60).padStart(2, '0');
                    document.getElementById('sysUptime').textContent = `${hours}:${minutes}:${secs}`;
                }
            }
        } catch (error) {
            console.error('❌ فشل تحميل معلومات النظام:', error);
        }
    }

    // ===== حفظ الملف الشخصي =====
    function saveProfile() {
        const username = document.getElementById('profileUsername').value;
        const email = document.getElementById('profileEmail').value;
        if (!username || !email) {
            alert('يرجى ملء جميع الحقول');
            return;
        }
        alert('✅ تم حفظ الملف الشخصي');
    }

    // ===== تغيير كلمة المرور =====
    function changePassword() {
        const oldPass = document.getElementById('oldPassword').value;
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        
        if (!oldPass || !newPass || !confirmPass) {
            alert('يرجى ملء جميع الحقول');
            return;
        }
        if (newPass !== confirmPass) {
            alert('كلمات المرور غير متطابقة');
            return;
        }
        if (newPass.length < 6) {
            alert('كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل');
            return;
        }
        alert('✅ تم تغيير كلمة المرور بنجاح');
    }

    // ===== حفظ السمة =====
    function saveTheme() {
        const theme = document.getElementById('themeSelect').value;
        alert(`✅ تم تغيير السمة إلى ${theme}`);
    }

    // ===== حفظ الإشعارات =====
    function saveNotifications() {
        alert('✅ تم حفظ إعدادات الإشعارات');
    }

    loadSystemInfo();
    setInterval(loadSystemInfo, 10000);
</script>
</body>
</html>
